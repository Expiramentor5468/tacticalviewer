name: Update tactical feed data

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/update_feeds.py
      - name: Commit changed feed data
        run: |
          git config user.name "tactical-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js data/feeds.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: refresh tactical feed watchlist"
            git push
          fi
