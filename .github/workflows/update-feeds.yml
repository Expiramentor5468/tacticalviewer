name: Update tactical feed data

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'data/manual_overrides.json'
      - '.github/workflows/update-feeds.yml'
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tactical-feed-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test verification and discovery rules
        run: python -m unittest discover -s tests -v
      - name: Test browser filtering and verification
        run: node --test tests/app.test.js
      - name: Refresh generic league sources
        id: refresh
        continue-on-error: true
        run: python scripts/update_feeds.py
      - name: Enrich Amazon Prime Vision fixtures
        id: primevision
        continue-on-error: true
        run: python scripts/enrich_prime_vision.py
      - name: Check Sky Bundesliga Tactical Feed
        id: skybundesliga
        continue-on-error: true
        run: python scripts/enrich_sky_bundesliga.py
      - name: Monitor known branded tactical and alternate-feed services
        id: brands
        continue-on-error: true
        run: python scripts/enrich_branded_monitors.py
      - name: Search worldwide for unknown tactical-feed products
        id: global
        continue-on-error: true
        run: python scripts/enrich_global_discovery.py
      - name: Commit changed feed data
        run: |
          git config user.name "tactical-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js data/feeds.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: refresh tactical feed watchlist"
            # Main may advance while this run is scanning (for example, a documentation
            # or parser edit). Replay the generated data commit on the latest main before
            # pushing instead of failing with a non-fast-forward error.
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Surface incomplete scans
        if: steps.refresh.outcome == 'failure' || steps.primevision.outcome == 'failure' || steps.skybundesliga.outcome == 'failure' || steps.brands.outcome == 'failure' || steps.global.outcome == 'failure'
        run: |
          echo 'One or more sources could not be checked. Failure details were published to the site; retained listings were not re-verified.'
          exit 1
