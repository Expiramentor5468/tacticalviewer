name: Update tactical feed data

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'data/manual_overrides.json'
      - '.github/workflows/update-feeds.yml'
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tactical-feed-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test verification and discovery rules
        run: python -m unittest discover -s tests -v
      - name: Test browser filtering and verification
        run: node --test tests/app.test.js
      - name: Refresh all sources and finalize scan status
        id: refresh
        continue-on-error: true
        run: python scripts/run_update.py
      - name: Commit changed feed data
        run: |
          git config user.name "tactical-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js data/feeds.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: refresh tactical feed watchlist"
            # Main may advance while this run is scanning (for example, a documentation
            # or parser edit). Replay the generated data commit on the latest main before
            # pushing instead of failing with a non-fast-forward error.
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Report incomplete scans
        if: steps.refresh.outcome == 'failure'
        run: |
          echo '::warning::One or more external sources could not be checked. Degraded source health was published to the site and retained listings were not re-verified.'
          echo 'This is treated as a degraded scan, not a workflow failure. Tests, updater execution, and publishing failures still fail the job normally.'
