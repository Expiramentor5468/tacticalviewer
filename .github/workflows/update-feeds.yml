name: Update tactical feed data

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'data/manual_overrides.json'
      - '.github/workflows/update-feeds.yml'
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tactical-feed-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test verification and discovery rules
        run: python -m unittest discover -s tests -v
      - name: Test browser filtering and verification
        run: node --test tests/app.test.js
      - name: Refresh generic sources
        id: refresh
        continue-on-error: true
        run: python scripts/update_feeds.py
      - name: Enrich Amazon Prime Vision fixtures
        id: primevision
        continue-on-error: true
        run: python scripts/enrich_prime_vision.py
      - name: Commit changed feed data
        run: |
          git config user.name "tactical-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js data/feeds.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: refresh tactical feed watchlist"
            git push
          fi
      - name: Surface incomplete scans
        if: steps.refresh.outcome == 'failure' || steps.primevision.outcome == 'failure'
        run: |
          echo 'One or more sources could not be checked. Failure details were published to the site; retained listings were not re-verified.'
          exit 1
